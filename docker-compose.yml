services:
  postgres:
    image: postgres:latest
    container_name: postgres_container
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: studs
    ports:
      - "5430:5432"
    volumes:
      - db-data:/var/lib/postgresql/
    command: >
      postgres -c max_connections=1000
               -c shared_buffers=256MB
               -c effective_cache_size=768MB
               -c maintenance_work_mem=64MB
               -c checkpoint_completion_target=0.7
               -c wal_buffers=16MB
               -c default_statistics_target=100
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d postgres" ]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 10s
    restart: unless-stopped
    tty: true
    stdin_open: true

  server:
    build:
      context: ./
      dockerfile: server/Dockerfile
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/studs
      DB_USER: postgres
      DB_PASSWORD: postgres
      JWT_SECRET: d2Zza2VqeG93bmdwa3drbWFzbGtma3NhbWZsa3NrYWxrZm1rbGFmbWtsYWZsa2Fz
    ports:
      - "4891:8080"
      - "4892:9990"
    healthcheck:
      test: [ "CMD-SHELL", "netstat -ltn | grep -c \":8080\"" ]
      interval: 5m
      retries: 5
      start_period: 5s
      timeout: 10s
    depends_on:
      postgres:
        condition: service_healthy

  client:
    build:
      context: ./
      dockerfile: client/Dockerfile
    ports:
      - "3001:3000"
    environment:
      API_URL: http://server:8080/server/api
    depends_on:
      server:
        condition: service_healthy

volumes:
  db-data:
    driver: local