services:
  postgres:
    image: postgres:latest
    container_name: postgres_container
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: studs
    ports:
      - "5430:5432"
    volumes:
      - db-data:/var/lib/postgresql/data/
    command: >
      postgres -c max_connections=1000
               -c shared_buffers=256MB
               -c effective_cache_size=768MB
               -c maintenance_work_mem=64MB
               -c checkpoint_completion_target=0.7
               -c wal_buffers=16MB
               -c default_statistics_target=100
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d postgres" ]
      interval: 5m
      retries: 5
      start_period: 5s
      timeout: 10s
    restart: unless-stopped
    tty: true
    stdin_open: true

  minio:
    image: minio/minio
    ports:
      - "9002:9000"
    volumes:
      - minio-data:/data
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data
    healthcheck:
      test: ["CMD-SHELL", "curl -I http://localhost:9000/minio/health/live"]
      interval: 5m
      retries: 5
      start_period: 5s
      timeout: 10s

  server:
    build:
      context: ./
      dockerfile: server/Dockerfile
    ports:
      - "4891:8080"
    healthcheck:
      test: [ "CMD-SHELL", "netstat -ltn | grep -c \":8080\"" ]
      interval: 5m
      retries: 5
      start_period: 5s
      timeout: 10s
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy

  client:
    build:
      context: ./
      dockerfile: client/Dockerfile
    ports:
      - "3001:3000"
    environment:
      API_URL: http://server:8080/api
    depends_on:
      server:
        condition: service_healthy

volumes:
  db-data:
    driver: local
  minio-data:
    driver: local